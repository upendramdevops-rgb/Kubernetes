apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: swiggy
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - swiggy
          topologyKey: kubernetes.io/hostname
  containers:
    - name: c1
      image: httpd
      ports:
        - containerPort: 80


